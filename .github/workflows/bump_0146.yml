name: Prepare 0.14.6
on:
  push:
    branches: [release-0.14.6]
permissions:
  contents: write
jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-0.14.6
      - name: Bump version consistently
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/version: "0\.14\.5"/version: "0.14.6"/' adaptive_ai/config.yaml
          sed -i 's/APP_VERSION = "0\.14\.5"/APP_VERSION = "0.14.6"/' adaptive_ai/src/settings.py
          sed -i 's/ARG BUILD_VERSION=0\.14\.5/ARG BUILD_VERSION=0.14.6/' adaptive_ai/Dockerfile
          sed -i 's/?v=0\.14\.5/?v=0.14.6/g' adaptive_ai/src/static/index.html
          sed -i 's/candidate_preference_ui\.js?v=0\.14\.5/candidate_preference_ui.js?v=0.14.6/g' adaptive_ai/src/agent_candidate_preference_metrics.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('adaptive_ai/BUILD_INFO.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          x['version']='0.14.6'
          x['release_date']='2026-09-16'
          x['base_version']='0.14.5'
          x['base_commit']='0efc7039'
          x['release_status']='release-0.14.6-candidate-ui-simplified-preference-timing'
          x['tests_passed']=561
          x['candidate_details_ui']='Candidate Details open state and promotion-rule form state persist across polling refresh; the main Candidate card exposes one decision row and one user-facing Promote action.'
          x['candidate_custom_promotion']='single user-facing Promote action uses the explicit custom evidence rules; atomic/config/Control qualification guards remain mandatory'
          x['manual_feedback_ui']='Live and Candidate cards expose Autonomous, Correct, Explore, Change decision and Settings; Candidate lifecycle exposes one Promote and Discard separately.'
          p.write_text(json.dumps(x, indent=2, ensure_ascii=False)+'\n', encoding='utf-8')
          PY
          rm .github/workflows/bump_0146.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add adaptive_ai .github/workflows/bump_0146.yml
          git commit -m 'Release 0.14.6'
          git push origin HEAD:release-0.14.6
