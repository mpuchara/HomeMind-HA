name: Validate HomeMind
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install vector-training dependency
        run: python -m pip install --disable-pip-version-check numpy==2.3.3
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q adaptive_ai/src tools/benchmark_product_runtime.py tools/run_product_runtime_benchmark.py tools/benchmark_correct_history.py tools/benchmark_training_qos.py tools/benchmark_ha_ingress.py tools/benchmark_shared_context.py tools/benchmark_observation_space.py tools/benchmark_tiny_mlp.py tools/benchmark_tiny_mlp_training.py tools/benchmark_tiny_mlp_correct.py tools/benchmark_hybrid_inference.py tools/benchmark_inference_hotspots.py tools/benchmark_candidate_deferred.py tools/benchmark_automatic_correct.py tools/benchmark_offline_rl.py tools/benchmark_stateful_replay.py tools/benchmark_persistent_worker.py tools/benchmark_parallel_training.py tools/benchmark_target_only_replay.py tools/benchmark_ram_replay_index.py tools/benchmark_transition_edges.py tools/benchmark_feature_snapshot_reuse.py tools/benchmark_long_memory.py tools/profile_pi_training.py tools/evaluate_pi4_release.py tools/smoke_entrypoint.py
      - run: node --check adaptive_ai/src/static/app.js && node --check adaptive_ai/src/static/debug_export_ui.js && node --check adaptive_ai/src/static/home.js && node --check adaptive_ai/src/static/polling_guard.js && node --check adaptive_ai/src/static/settings.js && node --check adaptive_ai/src/static/p0.js && node --check adaptive_ai/src/static/automation_baseline_ui.js && node --check adaptive_ai/src/static/queue.js && node --check adaptive_ai/src/static/experiments.js && node --check adaptive_ai/src/static/manual_feedback.js && node --check adaptive_ai/src/static/teach_observed_ui.js && node --check adaptive_ai/src/static/candidate_ui.js && node --check adaptive_ai/src/static/candidate_preference_ui.js && node --check adaptive_ai/src/static/agent_workflow_ui.js && node --check adaptive_ai/src/static/explore_ui.js && node --check adaptive_ai/src/static/promotion_lifecycle_ui.js && node --check adaptive_ai/src/static/confidence_contract_ui.js && node --check adaptive_ai/src/static/simple_agent_names.js && node --check adaptive_ai/src/static/runtime_activity_ui.js && node --check adaptive_ai/src/static/runtime_debug_ui.js
      - name: 0.14.111 RAM replay index component benchmark
        if: matrix.python == '3.11'
        run: python tools/benchmark_ram_replay_index.py --entities 12 --rows-per-entity 1800 --queries 500 --compact
      - name: 0.14.112 transition-edge index component benchmark
        if: matrix.python == '3.11'
        run: python tools/benchmark_transition_edges.py --entities 4 --rows-per-entity 1600 --queries 800 --compact
      - name: Numeric radar and relay full training benchmark
        run: python tools/benchmark_stationary_relay.py
      - name: 0.14.157 Shadow JSON data and checksum parity benchmark
        if: matrix.python == '3.11'
        run: python tools/benchmark_shadow_json.py
      - name: 0.14.161 observed-pool JSON snapshot parity benchmark
        if: matrix.python == '3.11'
        run: python tools/benchmark_observed_pool_json.py --compact
      - name: 0.14.162 indexed feature-journal pruning reference parity
        if: matrix.python == '3.11'
        run: python tools/benchmark_feature_prune.py --events 20000 --passes 2 --compact
      - name: 0.14.163 native witness full SHA and Shadow JSON parity
        if: matrix.python == '3.11'
        run: python tools/benchmark_native_witness.py --passes 4 --compact
      - name: 0.14.164 fresh indexed target-config retrieval parity
        if: matrix.python == '3.11'
        run: python tools/benchmark_target_configs.py --passes 20 --compact
      - name: 0.14.165 HA session fresh-query and connection-count parity
        if: matrix.python == '3.11'
        run: python tools/benchmark_target_configs.py --passes 32 --session --compact
      - name: 0.14.158 compact classifier fit reference parity benchmark
        if: matrix.python == '3.11'
        run: python tools/benchmark_classifier_fit.py --passes 3
      - name: 0.14.113 feature snapshot full replay benchmark
        if: matrix.python == '3.11'
        run: python tools/benchmark_feature_snapshot_reuse.py --compact
      - name: Stage 17 synthetic history-cost benchmark smoke
        if: matrix.python == '3.11'
        run: python tools/benchmark_history_costs.py --pairs 500 --teach-sensors 48 --teach-labels 12
      - name: 0.14.76 Correct history scaling benchmark
        if: matrix.python == '3.11'
        run: python tools/benchmark_correct_history.py --sizes 1000,2000,4000,8000 --compact
      - name: 0.14.77 active-home training QoS benchmark
        if: matrix.python == '3.11'
        run: python tools/benchmark_training_qos.py --compact
      - name: 0.14.78 HA ingest SQLite-decoupling benchmark
        if: matrix.python == '3.11'
        run: python tools/benchmark_ha_ingress.py --compact
      - name: 0.14.79 shared historical context profile
        if: matrix.python == '3.11'
        run: python tools/benchmark_shared_context.py --compact
      - name: 0.14.80 packaged Pi profiler CLI smoke
        if: matrix.python == '3.11'
        run: python adaptive_ai/src/pi_training_profile.py --help
      - name: 0.14.81 observation-space and hot-path benchmark
        if: matrix.python == '3.11'
        run: python tools/benchmark_observation_space.py --entities 775 --iterations 400 --compact
      - name: 0.14.82 tiny MLP Shadow inference/persistence benchmark
        if: matrix.python == '3.11'
        run: python tools/benchmark_tiny_mlp.py --iterations 200 --compact
      - name: 0.14.99 full Hybrid + Candidate hot-path baseline
        if: matrix.python == '3.11'
        run: |
          python tools/benchmark_hybrid_inference.py --iterations 80 --entities 8 --compact > hybrid-hot-path-baseline.json
          test -s hybrid-hot-path-baseline.json
          cat hybrid-hot-path-baseline.json
      - name: Upload 0.14.99 Hybrid hot-path baseline
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-hot-path-baseline-py311
          path: hybrid-hot-path-baseline.json
          if-no-files-found: error
          retention-days: 30
      - name: ETAP 2 deferred Candidate critical-path benchmark
        if: matrix.python == '3.11'
        run: python tools/benchmark_candidate_deferred.py --iterations 800 --roots 8 --compact
      - name: ETAP 4 same-process Hybrid hotspot profile
        if: matrix.python == '3.11'
        run: python tools/benchmark_inference_hotspots.py --iterations 400 --entities 8 --history-depth 96 --compact
      - name: 0.14.83 bounded supervised tiny MLP training benchmark
        if: matrix.python == '3.11'
        run: python tools/benchmark_tiny_mlp_training.py --samples 384 --holdout 160 --epochs 8 --features 96 --compact
      - name: 0.14.84 incremental neural Manual Correct benchmark
        if: matrix.python == '3.11'
        run: python tools/benchmark_tiny_mlp_correct.py --features 96 --parent-samples 384 --replay 192 --holdout 64 --epochs 4 --compact
      - name: 0.14.85 trusted Automatic Correct reward-buffer benchmark
        if: matrix.python == '3.11'
        run: python tools/benchmark_automatic_correct.py --rows 512 --summaries 2000 --compact
      - name: 0.14.86 conservative Offline-RL Candidate benchmark
        if: matrix.python == '3.11'
        run: python tools/benchmark_offline_rl.py --features 96 --parent-samples 384 --reward-contexts 128 --epochs 4 --compare-scalar --compact
      - name: 0.14.87 stateful replay continuation benchmark
        if: matrix.python == '3.11'
        run: python tools/benchmark_stateful_replay.py --hours 18 --sensors 32 --interval 60 --compact
      - name: 0.14.108 persistent training worker benchmark
        if: matrix.python == '3.11'
        run: python tools/benchmark_persistent_worker.py --chunks 6 --compact
      - name: 0.14.109 dual-agent CPU capacity benchmark
        if: matrix.python == '3.11'
        run: python tools/benchmark_parallel_training.py --cpu-seconds 0.35 --duty 0.85 --compact
      - name: 0.14.110 target-only replay stream benchmark
        if: matrix.python == '3.11'
        run: python tools/benchmark_target_only_replay.py --context-entities 12 --context-rows 4000 --target-rows 80 --compact
      - name: Agent Training vNext sparse long-memory boundedness benchmark
        if: matrix.python == '3.11'
        run: python tools/benchmark_long_memory.py --days 28 --transitions-per-day 192 --max-samples 96 --compact
      - name: Independent preference rollouts for historical training quality
        if: matrix.python == '3.11'
        run: python tools/benchmark_training_quality.py --compact
      - name: 0.14.88 Stage-9 Pi4 gate CLI smoke
        if: matrix.python == '3.11'
        run: python tools/evaluate_pi4_release.py --help
      - name: Stage 18 deterministic product runtime benchmark
        if: matrix.python == '3.11'
        env:
          ADAPTIVE_AI_DATA: ${{ runner.temp }}/homemind-product-benchmark
        run: python tools/run_product_runtime_benchmark.py --seeds 11,23,37 --replicas 1 --compact | tee product-benchmark-f24.json
      - name: Upload Stage 18 product benchmark report
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: product-benchmark-f24-py311
          path: product-benchmark-f24.json
          if-no-files-found: error
          retention-days: 30
      - name: Stage 18 actual source entrypoint smoke
        if: matrix.python == '3.11'
        run: python tools/smoke_entrypoint.py
      - run: python tools/simulate_anticipation.py
      - run: python tools/simulate_context_tournament.py
        env:
          ADAPTIVE_AI_DATA: ${{ runner.temp }}/homemind-context-tournament
      - run: python tools/simulate_fast_light_timing.py
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read addon version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version: "\(.*\)"/\1/p' adaptive_ai/config.yaml | head -n1)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Resolve Python base image with public mirror fallback
        shell: bash
        run: |
          if ! docker pull python:3.13-alpine; then
            docker pull public.ecr.aws/docker/library/python:3.13-alpine
            docker tag public.ecr.aws/docker/library/python:3.13-alpine python:3.13-alpine
          fi
      - run: docker build --build-arg BUILD_VERSION=${{ steps.version.outputs.version }} -t homemind:${{ steps.version.outputs.version }} adaptive_ai
      - run: python tools/smoke_image.py homemind:${{ steps.version.outputs.version }}
      - name: Verify packaged vectorized Tiny MLP trainer
        shell: bash
        run: |
          docker run --rm --entrypoint python homemind:${{ steps.version.outputs.version }} /app/tiny_mlp_training_benchmark.py --samples 384 --holdout 160 --epochs 8 --features 96 --compare-scalar --compact > tiny-mlp-image.json
          cat tiny-mlp-image.json
          python - <<'PY'
          import json
          row = json.load(open("tiny-mlp-image.json", encoding="utf-8"))
          assert row["pass"], row
          assert row["trainer"]["execution_backend"] == "numpy_vectorized", row["trainer"]
          assert row["scalar_reference"]["execution_backend"] == "python_scalar_fallback", row["scalar_reference"]
          assert row["scalar_reference"]["decision_parity"], row["scalar_reference"]
          PY
  package:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build both install package layouts
        run: |
          zip -r HomeMind-Adaptive-AI-repository.zip adaptive_ai
          (cd adaptive_ai && zip -r ../HomeMind-Adaptive-AI-addon-root.zip .)
      - name: Verify packaged active version and layout
        run: |
          python - <<'PY'
          import re, zipfile
          from pathlib import Path
          expected = re.search(r'^version: "([^"]+)"', Path('adaptive_ai/config.yaml').read_text(), re.M).group(1)
          cases = [
              ('HomeMind-Adaptive-AI-repository.zip', 'adaptive_ai/config.yaml', 'adaptive_ai/src/settings.py', 'adaptive_ai/'),
              ('HomeMind-Adaptive-AI-addon-root.zip', 'config.yaml', 'src/settings.py', ''),
          ]
          for archive, config_name, settings_name, prefix in cases:
              with zipfile.ZipFile(archive) as z:
                  names = set(z.namelist())
                  assert config_name in names, (archive, config_name)
                  assert settings_name in names, (archive, settings_name)
                  config = z.read(config_name).decode()
                  settings = z.read(settings_name).decode()
                  assert f'version: "{expected}"' in config, archive
                  assert f'APP_VERSION = "{expected}"' in settings, archive
                  for required in (
                      prefix+'src/startup_train_guard.py',
                      prefix+'src/rpi_low_power_runtime.py',
                      prefix+'src/release_016_guard.py',
                      prefix+'src/release_017_ui_lifeline.py',
                      prefix+'src/training_budget.py',
                      prefix+'src/training_process.py',
                      prefix+'src/pi_training_profile.py',
                      prefix+'src/pi4_release_gate.py',
                      prefix+'src/observation_space.py',
                      prefix+'src/policy_tiny_mlp.py',
                      prefix+'src/policy_tiny_mlp_training.py',
                      prefix+'src/policy_tiny_mlp_correct.py',
                      prefix+'src/tiny_mlp_shadow.py',
                      prefix+'src/hybrid_policy_runtime.py',
                      prefix+'src/inference_hot_path_metrics.py',
                      prefix+'src/hybrid_inference_benchmark.py',
                      prefix+'src/shared_inference_context.py',
                      prefix+'src/candidate_shadow_deferred.py',
                      prefix+'src/candidate_neural_shadow.py',
                      prefix+'src/tiny_mlp_benchmark.py',
                      prefix+'src/tiny_mlp_training_benchmark.py',
                      prefix+'src/tiny_mlp_correct_benchmark.py',
                      prefix+'src/automatic_correct_rewards.py',
                      prefix+'src/fast_automation_replay.py',
                      prefix+'src/automatic_correct_benchmark.py',
                      prefix+'src/policy_tiny_mlp_offline_rl.py',
                      prefix+'src/offline_rl_process.py',
                      prefix+'src/candidate_offline_rl.py',
                      prefix+'src/offline_rl_benchmark.py',
                      prefix+'src/static/polling_guard.js',
                      prefix+'src/static/debug_export_ui.js',
                      prefix+'src/static/runtime_activity_ui.js',
                      prefix+'src/static/runtime_debug_ui.js',
                      prefix+'src/runtime_debug_log.py',
                  ):
                      assert required in names, (archive, required)
          print('verified package version/layout/runtime files:', expected)
          PY
      - name: Upload install packages
        uses: actions/upload-artifact@v4
        with:
          name: HomeMind-Adaptive-AI-main
          path: |
            HomeMind-Adaptive-AI-repository.zip
            HomeMind-Adaptive-AI-addon-root.zip
          if-no-files-found: error
          retention-days: 30
