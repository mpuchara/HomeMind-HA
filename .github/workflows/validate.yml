name: Validate HomeMind
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q adaptive_ai/src
      - run: node --check adaptive_ai/src/static/app.js && node --check adaptive_ai/src/static/home.js && node --check adaptive_ai/src/static/settings.js && node --check adaptive_ai/src/static/p0.js && node --check adaptive_ai/src/static/automation_baseline_ui.js && node --check adaptive_ai/src/static/queue.js && node --check adaptive_ai/src/static/experiments.js && node --check adaptive_ai/src/static/manual_feedback.js && node --check adaptive_ai/src/static/teach_observed_ui.js && node --check adaptive_ai/src/static/candidate_ui.js && node --check adaptive_ai/src/static/agent_workflow_ui.js && node --check adaptive_ai/src/static/explore_ui.js && node --check adaptive_ai/src/static/promotion_lifecycle_ui.js && node --check adaptive_ai/src/static/simple_agent_names.js
      - run: python tools/simulate_anticipation.py
      - run: python tools/simulate_context_tournament.py
        env:
          ADAPTIVE_AI_DATA: ${{ runner.temp }}/homemind-context-tournament
      - run: python tools/simulate_fast_light_timing.py
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read addon version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version: "\(.*\)"/\1/p' adaptive_ai/config.yaml | head -n1)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - run: docker build --build-arg BUILD_VERSION=${{ steps.version.outputs.version }} -t homemind:${{ steps.version.outputs.version }} adaptive_ai
      - run: python tools/smoke_image.py homemind:${{ steps.version.outputs.version }}
  package:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build install package
        run: zip -r HomeMind-Adaptive-AI.zip adaptive_ai
      - name: Upload install package
        uses: actions/upload-artifact@v4
        with:
          name: HomeMind-Adaptive-AI-main
          path: HomeMind-Adaptive-AI.zip
          if-no-files-found: error
          retention-days: 30