name: Validate HomeMind
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q adaptive_ai/src tools/benchmark_product_runtime.py tools/run_product_runtime_benchmark.py tools/smoke_entrypoint.py
      - run: node --check adaptive_ai/src/static/app.js && node --check adaptive_ai/src/static/home.js && node --check adaptive_ai/src/static/polling_guard.js && node --check adaptive_ai/src/static/settings.js && node --check adaptive_ai/src/static/p0.js && node --check adaptive_ai/src/static/automation_baseline_ui.js && node --check adaptive_ai/src/static/queue.js && node --check adaptive_ai/src/static/experiments.js && node --check adaptive_ai/src/static/manual_feedback.js && node --check adaptive_ai/src/static/teach_observed_ui.js && node --check adaptive_ai/src/static/candidate_ui.js && node --check adaptive_ai/src/static/candidate_preference_ui.js && node --check adaptive_ai/src/static/agent_workflow_ui.js && node --check adaptive_ai/src/static/explore_ui.js && node --check adaptive_ai/src/static/promotion_lifecycle_ui.js && node --check adaptive_ai/src/static/confidence_contract_ui.js && node --check adaptive_ai/src/static/simple_agent_names.js && node --check adaptive_ai/src/static/runtime_activity_ui.js
      - name: Stage 17 synthetic history-cost benchmark smoke
        if: matrix.python == '3.11'
        run: python tools/benchmark_history_costs.py --pairs 500 --teach-sensors 48 --teach-labels 12
      - name: Stage 18 deterministic product runtime benchmark
        if: matrix.python == '3.11'
        env:
          ADAPTIVE_AI_DATA: ${{ runner.temp }}/homemind-product-benchmark
        run: python tools/run_product_runtime_benchmark.py --seeds 11,23,37 --replicas 1 --compact | tee product-benchmark-f24.json
      - name: Stage 18 actual source entrypoint smoke
        if: matrix.python == '3.11'
        run: python tools/smoke_entrypoint.py
      - run: python tools/simulate_anticipation.py
      - run: python tools/simulate_context_tournament.py
        env:
          ADAPTIVE_AI_DATA: ${{ runner.temp }}/homemind-context-tournament
      - run: python tools/simulate_fast_light_timing.py
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read addon version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version: "\(.*\)"/\1/p' adaptive_ai/config.yaml | head -n1)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - run: docker build --build-arg BUILD_VERSION=${{ steps.version.outputs.version }} -t homemind:${{ steps.version.outputs.version }} adaptive_ai
      - run: python tools/smoke_image.py homemind:${{ steps.version.outputs.version }}
  package:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build both install package layouts
        run: |
          zip -r HomeMind-Adaptive-AI-repository.zip adaptive_ai
          (cd adaptive_ai && zip -r ../HomeMind-Adaptive-AI-addon-root.zip .)
      - name: Verify packaged active version and layout
        run: |
          python - <<'PY'
          import re, zipfile
          from pathlib import Path
          expected = re.search(r'^version: "([^"]+)"', Path('adaptive_ai/config.yaml').read_text(), re.M).group(1)
          assert expected == '0.14.17', expected
          cases = [
              ('HomeMind-Adaptive-AI-repository.zip', 'adaptive_ai/config.yaml', 'adaptive_ai/src/settings.py', 'adaptive_ai/'),
              ('HomeMind-Adaptive-AI-addon-root.zip', 'config.yaml', 'src/settings.py', ''),
          ]
          for archive, config_name, settings_name, prefix in cases:
              with zipfile.ZipFile(archive) as z:
                  names = set(z.namelist())
                  assert config_name in names, (archive, config_name)
                  assert settings_name in names, (archive, settings_name)
                  config = z.read(config_name).decode()
                  settings = z.read(settings_name).decode()
                  assert f'version: "{expected}"' in config, archive
                  assert f'APP_VERSION = "{expected}"' in settings, archive
                  for required in (
                      prefix+'src/startup_train_guard.py',
                      prefix+'src/rpi_low_power_runtime.py',
                      prefix+'src/release_016_guard.py',
                      prefix+'src/release_017_ui_lifeline.py',
                      prefix+'src/static/polling_guard.js',
                      prefix+'src/static/runtime_activity_ui.js',
                  ):
                      assert required in names, (archive, required)
          print('verified package version/layout/runtime files:', expected)
          PY
      - name: Upload install packages
        uses: actions/upload-artifact@v4
        with:
          name: HomeMind-Adaptive-AI-main
          path: |
            HomeMind-Adaptive-AI-repository.zip
            HomeMind-Adaptive-AI-addon-root.zip
          if-no-files-found: error
          retention-days: 30
