name: Release bump 0.14.4

on:
  push:
    branches:
      - release/0.14.4

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.14.4
      - name: Bump release metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          replacements = {
              Path('adaptive_ai/config.yaml'): [('version: "0.14.3"', 'version: "0.14.4"')],
              Path('adaptive_ai/src/settings.py'): [('APP_VERSION = "0.14.3"', 'APP_VERSION = "0.14.4"')],
              Path('adaptive_ai/Dockerfile'): [('ARG BUILD_VERSION=0.14.3', 'ARG BUILD_VERSION=0.14.4')],
              Path('adaptive_ai/src/static/index.html'): [('0.14.3', '0.14.4')],
          }
          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          p = Path('adaptive_ai/BUILD_INFO.json')
          info = json.loads(p.read_text(encoding='utf-8'))
          info['version'] = '0.14.4'
          info['release_date'] = '2026-09-16'
          info['base_version'] = '0.14.3'
          info['base_commit'] = '24c02934'
          info['release_status'] = 'release-0.14.4-hard-user-corrections-ci-required'
          info['tests_passed'] = 552
          info['docker_build'] = 'github-actions-0.14.4-smoke-required'
          info['candidate_correct_update_budget'] = 'up to three balanced rounds, then up to twelve bounded desired-arm-only hard repair rounds for unresolved explicit corrections; rejected-action negative update remains one-time'
          info['candidate_correct_balance_gate'] = 'explicit marked corrections are hard fit targets; opposite-class anchors are soft regularization/evidence; missing opposite-class anchors remains insufficient evidence; held-out per-class/global regression and one-class-collapse remain authoritative'
          info['candidate_correct_hard_constraints'] = 'every usable user-marked Correct point must match its explicit Desired after bounded repair or standard offline promotion is blocked with Correct did not satisfy all marked corrections'
          weights = dict(info.get('teach_rl_supervised_weights') or {})
          weights['candidate_correct_hard_repair_max_rounds'] = 12
          info['teach_rl_supervised_weights'] = weights
          invariants = list(info.get('acceptance_invariants') or [])
          invariant = 'every usable user-marked Correct point is a hard fit target; stability anchors cannot veto it individually'
          if invariant not in invariants:
              invariants.append(invariant)
          info['acceptance_invariants'] = invariants
          p.write_text(json.dumps(info, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Commit release bump
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add adaptive_ai/config.yaml adaptive_ai/src/settings.py adaptive_ai/Dockerfile adaptive_ai/src/static/index.html adaptive_ai/BUILD_INFO.json
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Release HomeMind 0.14.4"
            git push origin HEAD:release/0.14.4
          fi
