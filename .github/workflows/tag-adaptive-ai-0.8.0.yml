name: Tag Adaptive AI 0.8.0

on:
  push:
    branches:
      - release-0.8.0
    paths:
      - '.github/workflows/tag-adaptive-ai-0.8.0.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create v0.8.0 tag and GitHub release from main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin main --tags
          MAIN_SHA="$(git rev-parse origin/main)"
          test "$MAIN_SHA" = "8b3fdbc390e27e2da46691582c890c8b41fb1c41"
          if ! git rev-parse -q --verify refs/tags/v0.8.0 >/dev/null; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a v0.8.0 "$MAIN_SHA" -m 'Adaptive AI 0.8.0 — feature-complete baseline'
            git push origin refs/tags/v0.8.0
          fi
          if ! gh release view v0.8.0 >/dev/null 2>&1; then
            gh release create v0.8.0 \
              --target "$MAIN_SHA" \
              --title 'Adaptive AI 0.8.0' \
              --notes $'First relatively feature-complete Adaptive AI baseline.\n\nHighlights:\n- low-memory manual per-agent training\n- one training job at a time by default\n- SQLite-streamed historical screening\n- replay scoped to selected context\n- ESPHome/LD2411 sensor context preservation\n- improved preparation/progress diagnostics\n- direct readable runtime sources under adaptive_ai/src\n\nRecommended rollout: train one agent, validate in Shadow, then enable Control only after benchmark and Verify control.'
          fi
