name: Fix Correct chart drag zoom 0.14.5

on:
  push:
    branches:
      - fix/correct-chart-drag-zoom-0.14.5

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/correct-chart-drag-zoom-0.14.5
      - name: Apply patch
        run: python tools/fix_correct_chart_drag_zoom_0145.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-correct-chart-drag-zoom-0145.yml tools/fix_correct_chart_drag_zoom_0145.py
          git add adaptive_ai tests/test_correct_chart_drag_zoom.py
          git commit -m "Restore Correct chart drag-to-zoom and release 0.14.5"
          git push origin HEAD:fix/correct-chart-drag-zoom-0.14.5
