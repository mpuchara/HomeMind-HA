name: Build Adaptive AI 0.7.13 package

on:
  push:
    branches:
      - adaptive-ai-v0.7.13-work
    paths:
      - 'tools/build_v0713.py'
      - '.github/workflows/materialize-adaptive-ai.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: adaptive-ai-v0.7.13-work
          fetch-depth: 1
      - name: Build and validate package
        shell: bash
        run: |
          set -euxo pipefail
          python tools/build_v0713.py
          cat _release_v0713/BUILD_OK.txt
          python - <<'PY'
          import zipfile
          p='_release_v0713/HomeMind-Adaptive-AI-0.7.13.zip'
          with zipfile.ZipFile(p) as z:
              bad=z.testzip()
              assert bad is None, bad
              names=set(z.namelist())
              required={'adaptive_ai/config.yaml','adaptive_ai/Dockerfile','adaptive_ai/src/main.py','adaptive_ai/src/control.py','adaptive_ai/src/run.sh','adaptive_ai/src/static/app.js','adaptive_ai/src/static/style.css'}
              missing=required-names
              assert not missing, missing
          print('ZIP integrity and layout OK')
          PY
      - name: Commit generated package and base64 transport parts
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _release_v0713
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Build Adaptive AI 0.7.13 install package'
          git push origin HEAD:adaptive-ai-v0.7.13-work
