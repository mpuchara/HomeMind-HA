name: Prepare HomeMind 0.14.12

on:
  push:
    branches:
      - release/0.14.12

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.14.12
          fetch-depth: 0
      - name: Bump release metadata
        env:
          RELEASE_VERSION: 0.14.12
          BASE_VERSION: 0.14.11
          BASE_COMMIT: 3f16ca8b8f9ac2920939cf6ed1fe18a29bc458e6
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          version = os.environ['RELEASE_VERSION']
          base_version = os.environ['BASE_VERSION']
          base_commit = os.environ['BASE_COMMIT']

          def rewrite(path, fn):
              p = Path(path)
              old = p.read_text(encoding='utf-8')
              new = fn(old)
              if new != old:
                  p.write_text(new, encoding='utf-8')

          rewrite('adaptive_ai/config.yaml', lambda s: re.sub(
              r'(?m)^version: "[^"]+"$', f'version: "{version}"', s, count=1))
          rewrite('adaptive_ai/src/settings.py', lambda s: re.sub(
              r'(?m)^APP_VERSION = "[^"]+"$', f'APP_VERSION = "{version}"', s, count=1))
          rewrite('adaptive_ai/Dockerfile', lambda s: re.sub(
              r'(?m)^ARG BUILD_VERSION=.*$', f'ARG BUILD_VERSION={version}', s, count=1))
          rewrite('adaptive_ai/src/static/index.html', lambda s: s.replace(base_version, version))

          build_path = Path('adaptive_ai/BUILD_INFO.json')
          build = json.loads(build_path.read_text(encoding='utf-8'))
          build.update({
              'version': version,
              'release_date': '2026-09-17',
              'base_version': base_version,
              'base_commit': base_commit,
              'release_status': 'release-0.14.12-stage18-product-benchmark',
              'tests_passed': 786,
              'docker_build': 'github-actions-0.14.12-final-entrypoint-product-benchmark-and-image-smoke-required',
              'product_benchmark_unmet_criteria': [
                  'needed_light_not_worse_than_fixed_by_more_than_2pp',
                  'premature_off_not_worse_than_fixed',
                  'corrections_not_worse_than_fixed',
                  'all_seeds_have_future_control_qualification',
              ],
              'product_benchmark_current_vs_fixed': (
                  'Final RuntimeCompositionRoot benchmark: production_current cuts mean false-ON time '
                  'to 11.0s vs 156.33s for fixed automation, but serves only 17.32% of needed-light '
                  'ticks vs 90.39%, has 32.0 vs 1.67 premature-OFF events, 58.67 vs 3.0 chatter '
                  'events and 294.44 vs 200 corrections/100 episodes; all three seeds fail the '
                  'unchanged Control Wilson qualification, so Stage-18 product criteria are not met.'
              ),
              'product_benchmark_full_ridge': (
                  'Full-ridge remains Shadow-only: mean needed-light coverage is 15.18% with 35 '
                  'premature-OFF events and 66 chatter events; it is not deployed and the default '
                  'DiagonalLinUCB backend remains unchanged.'
              ),
          })
          build_path.write_text(json.dumps(build, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          changelog = Path('adaptive_ai/CHANGELOG.md')
          current = changelog.read_text(encoding='utf-8')
          heading = f'# {version} — 2026-09-17'
          if not current.startswith(heading):
              entry = f'''{heading}\n\n- Release the Stage 13–18 runtime: calibrated confidence semantics, controlled cold-start/drift adaptation, DeviceAgent shared-resource arbitration, explicit RuntimeCompositionRoot and bounded history/training costs.\n- Add the deterministic F24 product benchmark with hidden occupancy/light need, sensor noise/delay/missingness, action-to-lux feedback, train/validation/future separation and multiple seeds.\n- Keep Candidate and backend challengers in Shadow unless the existing promotion/Control gates pass; no qualification threshold is relaxed for this release.\n- Final F24 result is intentionally non-passing: current runtime reduces false-ON time but under-serves needed light and increases premature-OFF/chatter/corrections; all three seeds remain below the unchanged per-action Wilson Control gate.\n- Preserve additive migrations, lineage, rollback, TrialRecords, labels and user settings. `ActionIntent -> Executor` remains the only physical Home Assistant dispatch path.\n- 786 automated tests pass on Python 3.11; the full Python 3.13 suite, compile/JS checks, Stage 17/18 benchmarks, source-entrypoint smoke and Docker image smoke pass. Raspberry Pi performance remains not measured.\n\n'''
              changelog.write_text(entry + current, encoding='utf-8')
          PY
      - name: Commit release bump when needed
        run: |
          if git diff --quiet; then
            echo "Release files already prepared"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add adaptive_ai/config.yaml adaptive_ai/src/settings.py adaptive_ai/Dockerfile adaptive_ai/src/static/index.html adaptive_ai/BUILD_INFO.json adaptive_ai/CHANGELOG.md
            git commit -m "Release 0.14.12"
            git push origin HEAD:release/0.14.12
          fi
      - name: Build install package
        run: zip -r HomeMind-Adaptive-AI-0.14.12.zip adaptive_ai
      - name: Upload install package
        uses: actions/upload-artifact@v4
        with:
          name: HomeMind-Adaptive-AI-0.14.12
          path: HomeMind-Adaptive-AI-0.14.12.zip
          if-no-files-found: error
          retention-days: 30
