configuration:
  poll_seconds:
    name: Interwał synchronizacji
    description: Interwał awaryjnej synchronizacji REST; decyzje realtime zwykle korzystają ze strumienia zdarzeń Home Assistanta.
  correction_window_seconds:
    name: Okno korekty
    description: Czas po akcji RL, w którym jawna zmiana użytkownika jest traktowana jako feedback/korekta.
  reward_window_seconds:
    name: Okno akceptacji
    description: Czas bez korekty potrzebny, aby akcja RL dostała dodatnią nagrodę.
  feature_dimensions:
    name: Jawne wymiary kontekstu
    description: Maksymalny rozmiar bezkolizyjnego, czasowego wektora kontekstu dla pojedynczego agenta.
  max_context_entities:
    name: Encje kontekstu na agenta
    description: Maksymalna liczba istotnych encji HA reprezentowanych jawnie przez jednego agenta.
  prediction_horizons_seconds:
    name: Horyzonty predykcji
    description: Horyzonty polityki w sekundach rozdzielone przecinkami. ACK i stabilizacja urządzenia mają osobne profile czasu.
  min_historical_support:
    name: Minimalne wsparcie historyczne
    description: Sterowanie jest blokowane, gdy podobnych danych historycznych jest zbyt mało.
  max_context_novelty:
    name: Maksymalna nowość kontekstu
    description: Sterowanie jest blokowane, gdy bieżący kontekst zbyt mocno różni się od historii treningowej.
  block_control_on_automation_conflict:
    name: Bezpieczeństwo konfliktu automatyzacji
    description: Opcja zgodności starszych wersji. Control wyłącza wykryte automatyzacje celu i weryfikuje przejęcie. Shadow nie steruje.
  action_bins:
    name: Poziomy akcji numerycznych
    description: Liczba dyskretnych poziomów akcji dla numerycznych polityk kontekstowych.
  rl_alpha:
    name: Siła eksploracji
    description: Zachowany parametr LinUCB. Mikroeksploracja jest nieaktywna w wersji 0.9.
  policy_half_life_days:
    name: Połowiczny zanik wiedzy agenta
    description: Liczba dni, po których starsze statystyki polityki zachowują połowę wagi.
  home_model_half_life_days:
    name: Połowiczny zanik modelu domu
    description: Liczba dni, po których starsze przejścia zachowują połowę wagi.
  entity_area_mapping:
    name: Jawne mapowanie obszarów
    description: JSON encja do identyfikatora obszaru; fallback po rejestrach encji i urządzeń HA.
  intent_ttl_seconds:
    name: Ważność intencji
    description: Maksymalny wiek intencji przed wykonaniem usługi, w sekundach.
