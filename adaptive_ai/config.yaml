name: "Adaptive AI"
version: "0.5.2"
slug: "adaptive_ai"
description: >-
  History-first local reinforcement-learning policies for Home Assistant. Imports
  Recorder history, auto-discovers actively used controllable devices, keeps a
  long-term local archive, and can directly control entities without generated automations.
stage: experimental
init: false
arch:
  - aarch64
  - amd64
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:brain
panel_title: Adaptive AI
panel_admin: true
backup: hot
options:
  poll_seconds: 30
  proactive_tick_seconds: 1
  realtime_inference_debounce_ms: 150
  prediction_lead_seconds: 20
  prediction_horizons_seconds: "5,15,30,60"
  correction_window_seconds: 90
  reward_window_seconds: 90
  feature_dimensions: 128
  max_context_entities: 28
  temporal_short_seconds: 60
  temporal_long_seconds: 300
  min_historical_support: 0.20
  max_context_novelty: 0.85
  block_control_on_automation_conflict: true
  action_bins: 31
  rl_alpha: 0.65
  history_bootstrap_days: 10
  archive_retention_days: 365
  archive_context_interval_seconds: 30
  auto_agent_min_changes: 2
  auto_agent_recent_days: 10
  max_auto_agents: 250
  automation_scan_enabled: true
  automation_hint_weight: 0.85
  history_maintenance_minutes: 30
  history_fast_context_hours: 24
  history_fast_target_hours: 6
  history_parallel_requests: 2
  history_context_import_interval_seconds: 60
  history_background_pause_ms: 250
  history_background_start_delay_seconds: 10
  process_nice: 10
schema:
  poll_seconds: "int(5,120)"
  proactive_tick_seconds: "int(1,10)"
  realtime_inference_debounce_ms: "int(50,2000)"
  prediction_lead_seconds: "int(0,300)"
  prediction_horizons_seconds: "str"
  correction_window_seconds: "int(10,600)"
  reward_window_seconds: "int(10,900)"
  feature_dimensions: "int(64,512)"
  max_context_entities: "int(4,80)"
  temporal_short_seconds: "int(10,600)"
  temporal_long_seconds: "int(30,3600)"
  min_historical_support: "float(0.0,1.0)"
  max_context_novelty: "float(0.0,1.0)"
  block_control_on_automation_conflict: "bool"
  action_bins: "int(5,61)"
  rl_alpha: "float(0.05,2.0)"
  history_bootstrap_days: "int(1,30)"
  archive_retention_days: "int(30,3650)"
  archive_context_interval_seconds: "int(5,300)"
  auto_agent_min_changes: "int(1,50)"
  auto_agent_recent_days: "int(1,30)"
  max_auto_agents: "int(10,500)"
  automation_scan_enabled: "bool"
  automation_hint_weight: "float(0.0,3.0)"
  history_maintenance_minutes: "int(5,360)"
  history_fast_context_hours: "int(6,72)"
  history_fast_target_hours: "int(6,72)"
  history_parallel_requests: "int(1,3)"
  history_context_import_interval_seconds: "int(5,300)"
  history_background_pause_ms: "int(0,3000)"
  history_background_start_delay_seconds: "int(0,120)"
  process_nice: "int(0,19)"
